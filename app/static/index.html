<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agora</title>
<style>
  :root {
    --bg: #fafaf7; --panel: #ffffff; --text: #1d1d1b; --muted: #8a8a85;
    --border: #e2e1dc; --accent: #2f5d8a; --mine: #e9eff5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1f1f1d; --text: #e8e6e1; --muted: #8f8d87;
      --border: #34332f; --accent: #8db8e3; --mine: #23303d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 600; }
  header span { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 14px; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { max-width: 760px; margin: 0 auto 16px; padding: 12px 14px; border-radius: 10px;
         background: var(--panel); border: 1px solid var(--border); }
  .msg.mine { background: var(--mine); border-color: transparent; }
  .answer { white-space: pre-wrap; }
  .answer a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .answer a:hover { text-decoration: underline; }
  .error { color: #c0392b; }
  .sources { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
  .sources > summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  details.source { margin: 6px 0 0 4px; }
  details.source > summary { cursor: pointer; font-size: 14px; }
  details.source p { margin: 6px 0 4px 16px; font-size: 14px; white-space: pre-wrap; }
  details.source .score { color: var(--muted); font-size: 12px; margin-left: 16px; }
  details.source.flash > summary { background: var(--mine); border-radius: 4px; }
  .timings { margin-top: 8px; color: var(--muted); font-size: 12px; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border);
         max-width: 792px; width: 100%; margin: 0 auto; }
  input { flex: 1; min-width: 0; padding: 10px 12px; font: inherit; color: var(--text);
          background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
  button { padding: 10px 18px; font: inherit; border: 0; border-radius: 8px;
           background: var(--accent); color: var(--bg); cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<header>Agora <span>answers from the texts, with citations</span></header>
<main id="messages"></main>
<form id="ask">
  <input id="question" name="question" type="text" autocomplete="off" autofocus
         placeholder="Ask a question about the texts…" aria-label="Question">
  <button id="send" type="submit">Send</button>
</form>

<script>
// Everything shown on the page is inserted with textContent / createTextNode, never as HTML,
// so passage or answer text cannot inject markup.

const messages = document.getElementById("messages");
const form = document.getElementById("ask");
const input = document.getElementById("question");
const send = document.getElementById("send");
let answerCount = 0;

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function scrollToBottom() {
  messages.scrollTop = messages.scrollHeight;
}

// Parse a text/event-stream body as it arrives; calls onEvent(name, decodedData) per event.
async function readSSE(response, onEvent) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const { value, done } = await reader.read();
    buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
    buffer = buffer.replace(/\r\n?/g, "\n");
    let end;
    while ((end = buffer.indexOf("\n\n")) !== -1) {
      const block = buffer.slice(0, end);
      buffer = buffer.slice(end + 2);
      let name = "message";
      const data = [];
      for (const line of block.split("\n")) {
        if (line.startsWith("event:")) name = line.slice(6).trim();
        else if (line.startsWith("data:")) data.push(line.slice(5).replace(/^ /, ""));
      }
      if (data.length) onEvent(name, JSON.parse(data.join("\n")));
    }
    if (done) return;
  }
}

// Redraw the answer from its full text, turning [n] (and [n, m]) into links to known sources.
// Done from scratch on every token because a citation can be split across tokens.
function renderAnswer(node, text, sourceIds) {
  node.replaceChildren();
  const pattern = /\[(\d+(?:\s*,\s*\d+)*)\]/g;
  let last = 0;
  for (const match of text.matchAll(pattern)) {
    const numbers = match[1].split(",").map((s) => s.trim());
    if (!numbers.every((n) => sourceIds.has(n))) continue;  // leave unknown numbers as text
    node.append(document.createTextNode(text.slice(last, match.index)));
    node.append(document.createTextNode("["));
    numbers.forEach((n, i) => {
      if (i) node.append(document.createTextNode(", "));
      const link = el("a", null, n);
      link.href = "#" + sourceIds.get(n);
      link.addEventListener("click", (event) => {
        event.preventDefault();
        openSource(sourceIds.get(n));
      });
      node.append(link);
    });
    node.append(document.createTextNode("]"));
    last = match.index + match[0].length;
  }
  node.append(document.createTextNode(text.slice(last)));
}

function openSource(id) {
  const source = document.getElementById(id);
  if (!source) return;
  source.closest("details.sources").open = true;
  source.open = true;
  source.scrollIntoView({ behavior: "smooth", block: "center" });
  source.classList.add("flash");
  setTimeout(() => source.classList.remove("flash"), 1200);
}

function renderSources(container, sources, sourceIds, prefix) {
  const list = el("details", "sources");
  list.append(el("summary", null, `Sources (${sources.length})`));
  for (const s of sources) {
    const id = `${prefix}-source-${s.n}`;
    sourceIds.set(String(s.n), id);
    const item = el("details", "source");
    item.id = id;
    item.append(el("summary", null, `[${s.n}] ${s.work}, ${s.section}`));
    item.append(el("p", null, s.text));
    item.append(el("div", "score", `similarity ${s.score.toFixed(3)}`));
    list.append(item);
  }
  container.append(list);
}

function formatTimings(t) {
  const sec = (ms) => (ms / 1000).toFixed(2) + " s";
  const parts = [`search ${sec(t.search_ms)}`];
  if (t.first_token_ms != null) parts.push(`first token ${sec(t.first_token_ms)}`);
  parts.push(`total ${sec(t.total_ms)}`);
  return parts.join(" · ");
}

async function ask(question) {
  messages.append(el("div", "msg mine", question));

  const prefix = `a${++answerCount}`;
  const box = el("div", "msg");
  const answer = el("div", "answer", "…");
  box.append(answer);
  messages.append(box);
  scrollToBottom();

  const sourceIds = new Map();
  let text = "";
  try {
    const response = await fetch("/ask/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    if (!response.ok) throw new Error(`The server answered ${response.status}.`);
    await readSSE(response, (name, data) => {
      if (name === "sources") {
        renderSources(box, data, sourceIds, prefix);
      } else if (name === "token") {
        text += data;
        renderAnswer(answer, text, sourceIds);
      } else if (name === "done") {
        box.append(el("div", "timings", formatTimings(data)));
      }
      scrollToBottom();
    });
    if (!text) answer.textContent = "(no answer)";
  } catch (error) {
    if (!text) answer.textContent = "";
    answer.append(el("div", "error", `Something went wrong: ${error.message}`));
  }
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();  // Enter in the input submits the form too
  const question = input.value.trim();
  if (!question || send.disabled) return;
  input.value = "";
  send.disabled = true;
  try {
    await ask(question);
  } finally {
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
